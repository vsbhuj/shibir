<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style id="css">
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e1d8;--ok:#1f8a4c;--okbg:#e6f4ec;--acc:#b5541c}
body{font-family:'Noto Sans Gujarati',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 12px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1 small{font-size:14px;color:var(--ok);font-weight:700;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font:inherit;font-size:14px;color:var(--ink)}
.tab b{font-weight:700;margin-left:4px;color:var(--mute)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.on b{color:#cfe9d9}
.tab.done b{color:var(--ok)}
.tab.on.done b{color:#9be0b6}
.tools{display:flex;gap:6px;margin-top:6px}
.tools input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;background:var(--card)}
.tools button,.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink)}
.filt{display:flex;gap:6px;margin-top:6px}
.filt button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px;font:inherit;font-size:13px;color:var(--mute)}
.filt button.on{border-color:var(--ink);color:var(--ink);font-weight:700}
main{padding:10px 12px 90px}
.vh{font-size:15px;font-weight:700;margin:14px 2px 6px;color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer;user-select:none}
.row.ok{background:var(--okbg);border-color:#bfe3cc}
.chk{flex:0 0 34px;height:34px;border-radius:8px;border:2px solid #bdb9ad;display:grid;place-items:center;font-size:20px;color:#fff;font-weight:700}
.row.ok .chk{background:var(--ok);border-color:var(--ok)}
.info{flex:1;min-width:0}
.nm{font-weight:600;font-size:15.5px;line-height:1.35}
.meta{font-size:12.5px;color:var(--mute);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .id{font-weight:700;color:var(--ink)}
.tm{flex:0 0 auto;text-align:right;font-size:13px;font-weight:700;color:var(--ok);line-height:1.2}
.tm span{display:block;font-size:11px;font-weight:400;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:30px 0}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center}
footer .btn{flex:1}
.sync{font-size:11px;color:var(--mute);text-align:center;flex:0 0 70px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.box{background:var(--card);border-radius:14px;padding:18px;max-width:340px;width:100%}
.box p{margin-bottom:14px;line-height:1.5}
.box .acts{display:flex;gap:8px}
.box .acts button{flex:1;padding:10px;border-radius:8px;font:inherit;border:1px solid var(--line);background:var(--card)}
.box .acts .red{background:#b3261e;color:#fff;border-color:#b3261e}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
</style>

const LSK="regchk_manakuva_v1";
let state;try{state=JSON.parse(document.getElementById("st").textContent)}catch(e){state={checks:{}}}
if(!state.checks)state.checks={};
let pending={};try{pending=JSON.parse(localStorage.getItem(LSK+"_p")||"{}")}catch(e){}
let ui={tab:0,q:"",f:"all"};try{Object.assign(ui,JSON.parse(localStorage.getItem(LSK+"_ui")||"{}"));ui.q=""}catch(e){}
let art=null,canWrite=true,pubTimer=null,syncMsg="";
// apply unsynced local edits on top of shared state
let hadPending=false;
for(const k in pending){const cur=state.checks[k]||null;if(cur===pending[k]){delete pending[k];continue}
  hadPending=true;if(pending[k])state.checks[k]=pending[k];else delete state.checks[k]}
try{localStorage.setItem(LSK+"_p",JSON.stringify(pending))}catch(e){}

const $=s=>document.querySelector(s);
const fmtT=ts=>new Date(ts).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true,timeZone:"Asia/Kolkata"});
const fmtD=ts=>new Date(ts).toLocaleDateString("en-IN",{day:"2-digit",month:"short",timeZone:"Asia/Kolkata"});
const fmtFull=ts=>fmtD(ts)+" "+fmtT(ts);
const total=DATA.reduce((a,g)=>a+g.p.length,0);
const doneIn=g=>g.p.filter(r=>state.checks[r[0]]).length;

function saveLocal(){try{localStorage.setItem(LSK+"_p",JSON.stringify(pending));localStorage.setItem(LSK+"_ui",JSON.stringify({tab:ui.tab,f:ui.f}))}catch(e){}}

function render(){
  const done=Object.keys(state.checks).length;
  const tabs=[{v:"બધા ગામ",p:DATA.flatMap(g=>g.p)}].concat(DATA);
  let h=`<header><h1>રજીસ્ટ્રેશન – માનકુવા પ્રદેશ <small>${done} / ${total}</small></h1>
  <div class="bar"><i style="width:${done/total*100}%"></i></div>
  <div class="tabs">${tabs.map((g,i)=>{const d=doneIn(g);return `<button class="tab ${i===ui.tab?"on":""} ${d===g.p.length?"done":""}" data-tab="${i}">${g.v}<b>${d}/${g.p.length}</b></button>`}).join("")}</div>
  <div class="tools"><input id="q" placeholder="ID કે નામ શોધો…" value="${ui.q}" inputmode="search"></div>
  <div class="filt">${[["all","બધા"],["no","બાકી"],["yes","આવી ગયા ✓"]].map(([k,t])=>`<button data-f="${k}" class="${ui.f===k?"on":""}">${t}</button>`).join("")}</div>
  </header><main>`;
  const q=ui.q.trim();
  const groups=ui.tab===0?DATA:[DATA[ui.tab-1]];
  let shown=0;
  for(const g of groups){
    const rows=g.p.filter(r=>{
      const c=!!state.checks[r[0]];
      if(ui.f==="no"&&c)return false;if(ui.f==="yes"&&!c)return false;
      if(q&&!(String(r[0]).includes(q)||r[1].includes(q)))return false;return true});
    if(!rows.length)continue;
    if(ui.tab===0)h+=`<div class="vh">${g.v} (${doneIn(g)}/${g.p.length})</div>`;
    for(const r of rows){shown++;const ts=state.checks[r[0]];
      h+=`<div class="row ${ts?"ok":""}" data-id="${r[0]}"><div class="chk">${ts?"✓":""}</div>
      <div class="info"><div class="nm">${r[1]}</div><div class="meta"><span class="id">${r[0]}</span><span>રૂમ ${r[2]}</span><span>${r[3]}</span></div></div>
      ${ts?`<div class="tm">${fmtT(ts)}<span>${fmtD(ts)}</span></div>`:""}</div>`}
  }
  if(!shown)h+=`<div class="empty">કોઈ નામ નથી</div>`;
  h+=`</main><footer><button class="btn" id="copy">રિપોર્ટ કૉપી</button><button class="btn" id="dl">CSV ડાઉનલોડ</button><div class="sync" id="sync">${syncMsg}</div></footer>
  <div class="modal" id="m"><div class="box"><p id="mt"></p><div class="acts"><button id="mno">ના</button><button class="red" id="myes">હા, ✓ હટાવો</button></div></div></div><div class="toast" id="toast"></div>`;
  const app=$("#app");const y=window.scrollY;app.innerHTML=h;window.scrollTo(0,y);
  if(document.activeElement!==$("#q")&&ui._focus){$("#q").focus();const L=$("#q").value.length;$("#q").setSelectionRange(L,L);ui._focus=false}
}

function toast(t){const e=$("#toast");if(!e)return;e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function setSync(t){syncMsg=t;const e=$("#sync");if(e)e.textContent=t}

function find(id){for(const g of DATA)for(const r of g.p)if(String(r[0])===String(id))return [g,r];return null}

function setCheck(id,val){
  if(val)state.checks[id]=val;else delete state.checks[id];
  pending[id]=val||null;saveLocal();render();
  schedulePublish();
}
function schedulePublish(){
  if(!art||!canWrite){setSync(art?"ફક્ત જોવા":"આ ફોનમાં સેવ");return}
  setSync("સેવ થાય છે…");clearTimeout(pubTimer);pubTimer=setTimeout(doPublish,1500);
}
function buildDoc(){
  const json=JSON.stringify(state).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"gu\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>"+document.title+"</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style id=\"css\">"+document.getElementById("css").textContent+"</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<script type=\"application/json\" id=\"st\">"+json+"<\/script>\n<script id=\"appjs\">"+document.getElementById("appjs").textContent+"<\/script>\n</body>\n</html>\n";
}
async function doPublish(){
  try{await art.publish(buildDoc());pending={};saveLocal();setSync("✓ સેવ થયું")}
  catch(e){const c=(e&&(e.code||e.name||e.message))||"";
    if(/not_granted|not_writer/.test(c)){canWrite=false;setSync("ફક્ત જોવા")}
    else if(/conflict/.test(c)){setSync("ફરી લોડ…")}
    else{setSync("સેવ ન થયું");toast("સેવ ન થયું – ફરી ટીક કરો")}}
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){ui.tab=+t.dataset.tab;saveLocal();render();window.scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");if(f){ui.f=f.dataset.f;saveLocal();render();return}
  if(e.target.id==="mno"){$("#m").classList.remove("on");return}
  if(e.target.id==="myes"){const id=$("#m").dataset.id;$("#m").classList.remove("on");setCheck(id,null);toast("✓ હટાવ્યું");return}
  if(e.target.id==="copy"){copyReport();return}
  if(e.target.id==="dl"){downloadCSV();return}
  const r=e.target.closest(".row");if(r){const id=r.dataset.id;
    if(state.checks[id]){const x=find(id);$("#mt").innerHTML=`<b>${x[1][1]}</b> (${id})<br>${fmtFull(state.checks[id])} એ ✓ કરેલ છે. ✓ હટાવવું છે?`;$("#m").dataset.id=id;$("#m").classList.add("on")}
    else{const now=new Date().toISOString();setCheck(id,now);toast("✓ "+find(id)[1][1].split(" ")[1]+" – "+fmtT(now))}}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){ui.q=e.target.value;ui._focus=true;render()}});

function copyReport(){
  let t=`*રજીસ્ટ્રેશન – માનકુવા પ્રદેશ*\nકુલ આવ્યા: ${Object.keys(state.checks).length}/${total}\n`;
  for(const g of DATA){t+=`\n*${g.v}* (${doneIn(g)}/${g.p.length})\n`;
    for(const r of g.p){const ts=state.checks[r[0]];t+=(ts?"✅ ":"⬜ ")+r[0]+" "+r[1]+(ts?" – "+fmtT(ts):"")+"\n"}}
  const done=()=>toast("રિપોર્ટ કૉપી થયો – WhatsAppમાં પેસ્ટ કરો");
  try{navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done))}catch(e){fallbackCopy(t,done)}
}
function fallbackCopy(t,cb){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");cb()}catch(e){toast("કૉપી ન થયું")}a.remove()}
async function downloadCSV(){
  const esc=s=>'"'+String(s).replace(/"/g,'""')+'"';
  let c="﻿ગામ,ID,નામ,રૂમ નં.,Group,હાજર,સમય\n";
  for(const g of DATA)for(const r of g.p){const ts=state.checks[r[0]];c+=[g.v,r[0],r[1],"(PL-01) "+r[2],r[3],ts?"હા":"ના",ts?fmtFull(ts):""].map(esc).join(",")+"\n"}
  try{const d=await window.claude.use("downloads");if(!d)throw 0;await d.save({filename:"registration_manakuva.csv",data:c});}
  catch(e){toast("ડાઉનલોડ ન થયું – રિપોર્ટ કૉપી વાપરો")}
}

render();
if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(a=>{art=a;
    if(!a){setSync("આ ફોનમાં સેવ");return}
    setSync("ઓનલાઇન");
    if(hadPending)schedulePublish();
  }).catch(()=>setSync("આ ફોનમાં સેવ"));
}else setSync("આ ફોનમાં સેવ");
</script>
</body>
</html>
